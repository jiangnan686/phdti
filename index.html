<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PHDTI — PhD Type Indicator</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700;900&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #FFFFFF;
  --bg-warm: #F5F3EF;
  --bg-white: #FFFFFF;
  --ink: #1A1A1A;
  --ink2: #6B6B6B;
  --ink3: #A0A0A0;
  --ink4: #D4D4D4;
  --accent: #FF5733;
  --accent-soft: rgba(255,87,51,0.08);
  --accent-med: rgba(255,87,51,0.15);
  --green: #2ECC71;
  --blue: #3B82F6;
  --purple: #8B5CF6;
  --yellow: #F59E0B;
  --red: #E74C3C;
  --radius: 20px;
  --radius-sm: 14px;
  --radius-xs: 10px;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.04);
  --shadow-md: 0 4px 16px rgba(0,0,0,0.06);
  --shadow-lg: 0 8px 32px rgba(0,0,0,0.08);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Noto Sans SC',-apple-system,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}

.screen{display:none;min-height:100vh;flex-direction:column}
.screen.active{display:flex}

/* INTRO */
.intro-screen{padding:0 24px;justify-content:center;align-items:center;text-align:center;position:relative;overflow:hidden}

.intro-badge{display:inline-block;font-size:11px;font-weight:600;letter-spacing:1.5px;padding:6px 14px;border-radius:20px;background:var(--accent-soft);color:var(--accent);margin-bottom:24px;text-transform:uppercase}
.intro-icon{font-size:72px;margin-bottom:20px;animation:breathe 4s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}

.intro-title{font-family:'Playfair Display',serif;font-size:38px;font-weight:800;letter-spacing:-1px;line-height:1.15;margin-bottom:6px}
.intro-subtitle{font-size:16px;color:var(--ink2);margin-bottom:28px;font-weight:400}
.intro-desc{font-size:14px;color:var(--ink3);line-height:1.8;max-width:300px;margin:0 auto 20px}

.intro-dims{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:32px}
.intro-dim{font-size:12px;padding:6px 14px;border-radius:20px;background:var(--bg-warm);color:var(--ink2);font-weight:500;border:1px solid rgba(0,0,0,0.04)}

.intro-disclaimer{font-size:11px;color:var(--ink3);margin-bottom:32px;padding:10px 16px;background:var(--bg-warm);border-radius:var(--radius-xs);display:inline-block}

.intro-start{display:block;width:100%;max-width:300px;padding:18px;border:none;border-radius:14px;background:var(--ink);color:#FFF;font-size:16px;font-weight:600;cursor:pointer;font-family:'Noto Sans SC',sans-serif;transition:transform .15s,opacity .15s;letter-spacing:.3px}
.intro-start:active{transform:scale(.97);opacity:.85}

.intro-footer{margin-top:40px;font-size:11px;color:var(--ink4);letter-spacing:.5px}

/* QUESTION */
.q-screen{padding:0 0 40px;background:var(--bg)}
.q-top{padding:56px 24px 12px;display:flex;align-items:center;gap:14px;position:sticky;top:0;background:var(--bg);z-index:10}
.q-back{width:38px;height:38px;border-radius:12px;background:var(--bg-warm);border:1px solid rgba(0,0,0,.05);color:var(--ink);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.q-back:active{background:var(--ink4)}
.q-top-title{font-size:15px;font-weight:600;color:var(--ink2)}

.q-progress{display:flex;gap:4px;padding:0 24px;margin-bottom:8px}
.q-dot{flex:1;height:3px;border-radius:2px;background:var(--ink4);transition:background .35s}
.q-dot.done{background:var(--ink)}
.q-dot.now{background:var(--accent)}

.q-body{padding:28px 24px 0}
.q-counter{font-size:12px;color:var(--ink3);font-weight:500;letter-spacing:1px;margin-bottom:14px}
.q-text{font-size:22px;font-weight:700;line-height:1.45;margin-bottom:8px;letter-spacing:-.2px}
.q-hint{font-size:13px;color:var(--ink3);margin-bottom:28px;font-style:italic}

.q-opts{display:flex;flex-direction:column;gap:10px;padding:0 24px 24px}
.q-opt{background:var(--bg-white);border:1.5px solid rgba(0,0,0,.07);border-radius:var(--radius-sm);padding:18px 20px;font-size:15px;color:var(--ink);cursor:pointer;transition:all .15s;text-align:left;font-family:'Noto Sans SC',sans-serif;line-height:1.5;box-shadow:var(--shadow-sm)}
.q-opt:active{transform:scale(.98);border-color:var(--ink);background:var(--bg-warm)}

/* RESULT */
.r-screen{padding:0 0 60px;background:var(--bg);align-items:center}

.r-card{background:var(--bg);border-radius:0;padding:40px 24px 32px;box-shadow:none;border:none;position:relative;overflow:hidden;width:100%;max-width:480px;text-align:center}
.r-bar{position:absolute;top:0;left:0;right:0;height:4px}
.r-portrait{width:200px;height:auto;max-height:260px;object-fit:contain;margin:0 auto 20px;display:block;border-radius:16px}
.r-emoji{font-size:56px;margin-bottom:14px;display:none}
.r-code{font-family:'Playfair Display',serif;font-size:40px;font-weight:800;letter-spacing:3px;margin-bottom:2px}
.r-name{font-size:18px;color:var(--ink2);font-weight:600;margin-bottom:6px}
.r-tagline{font-size:14px;color:var(--ink3);font-style:italic;margin-bottom:24px}
.r-divider{width:40px;height:2px;background:var(--ink4);margin:0 auto 24px}
.r-desc{font-size:14px;color:var(--ink2);line-height:1.9;margin-bottom:28px;text-align:left}

.r-dims{margin-bottom:28px}
.r-dim-row{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.r-dim-label{font-size:12px;color:var(--ink3);width:28px;text-align:center;font-weight:600}
.r-dim-track{flex:1;height:6px;background:var(--bg-warm);border-radius:3px;position:relative;overflow:hidden}
.r-dim-fill{position:absolute;top:0;height:100%;border-radius:3px;transition:width 1s ease}
.r-dim-fill.left{left:0}
.r-dim-fill.right{right:0}
.r-dim-pct{font-size:11px;color:var(--ink3);width:32px;text-align:center;font-weight:500}

.r-tags{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-bottom:28px}
.r-tag{font-size:12px;padding:6px 14px;border-radius:20px;background:var(--bg-warm);color:var(--ink2);font-weight:500}

.r-brand{font-size:11px;color:var(--ink4);letter-spacing:1px;margin-top:8px}

.r-btns{display:flex;gap:10px;margin-top:20px;width:100%;max-width:480px;padding:0 24px}
.r-btn{flex:1;padding:16px;border-radius:14px;border:none;font-size:14px;font-weight:600;cursor:pointer;font-family:'Noto Sans SC',sans-serif;transition:transform .15s}
.r-btn:active{transform:scale(.97)}
.r-btn-dark{background:var(--ink);color:#FFF}
.r-btn-light{background:var(--bg-warm);color:var(--ink);border:1px solid rgba(0,0,0,.06)}

/* Share card (hidden, for screenshot) */
.share-card{position:fixed;left:-9999px;top:0;width:375px;background:#FFF;padding:40px 28px 32px;text-align:center;z-index:-1}
.share-card .r-portrait{width:180px;max-height:240px}
.share-card .r-code{font-family:'Playfair Display',serif;font-size:36px;font-weight:800;letter-spacing:3px;margin-bottom:2px}
.share-card .r-name{font-size:17px;color:var(--ink2);font-weight:600;margin-bottom:4px}
.share-card .r-tagline{font-size:13px;color:var(--ink3);font-style:italic;margin-bottom:16px}
.share-card .r-divider{width:40px;height:2px;background:var(--ink4);margin:0 auto 16px}
.share-card .r-dims{margin-bottom:20px}
.share-card .r-dim-row{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.share-card .r-dim-label{font-size:11px;width:24px}
.share-card .r-dim-track{flex:1;height:5px;background:#F0EDE8;border-radius:3px;position:relative;overflow:hidden}
.share-card .r-dim-fill{position:absolute;top:0;height:100%;border-radius:3px}
.share-card .r-tags{display:flex;flex-wrap:wrap;justify-content:center;gap:5px;margin-bottom:20px}
.share-card .r-tag{font-size:11px;padding:4px 10px;border-radius:16px;background:#F5F3EF;color:var(--ink2)}
.share-card .r-brand{font-size:11px;color:var(--ink4);letter-spacing:1px}
.share-card .share-qr{margin-top:16px;font-size:11px;color:var(--ink3)}

/* Share overlay */
.share-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.6);z-index:1000;justify-content:center;align-items:center;padding:20px}
.share-overlay.active{display:flex}
.share-preview{background:#FFF;border-radius:16px;padding:20px;max-width:340px;width:100%;text-align:center;max-height:90vh;overflow-y:auto}
.share-preview img{width:100%;border-radius:8px;margin-bottom:16px;box-shadow:0 2px 12px rgba(0,0,0,0.1)}
.share-preview-title{font-size:15px;font-weight:600;margin-bottom:4px}
.share-preview-hint{font-size:12px;color:var(--ink3);margin-bottom:16px}
.share-preview-btns{display:flex;gap:8px}
.share-preview-btns button{flex:1;padding:12px;border-radius:12px;border:none;font-size:13px;font-weight:600;cursor:pointer;font-family:'Noto Sans SC',sans-serif}
.share-save{background:var(--ink);color:#FFF}
.share-close{background:#F0F0F0;color:var(--ink)}

@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.anim{animation:fadeUp .45s ease forwards}
.anim-d1{animation-delay:.06s;opacity:0}
.anim-d2{animation-delay:.12s;opacity:0}
.anim-d3{animation-delay:.18s;opacity:0}

/* ===== RESPONSIVE ===== */

/* Small phones (iPhone SE, 375px and below) */
@media (max-width: 380px) {
  .intro-title { font-size: 32px; }
  .intro-subtitle { font-size: 14px; }
  .intro-desc { font-size: 13px; }
  .intro-dims { gap: 6px; }
  .intro-dim { font-size: 11px; padding: 5px 10px; }
  .intro-screen { padding: 0 18px; }

  .q-body { padding: 20px 18px 0; }
  .q-text { font-size: 19px; }
  .q-opts { padding: 0 18px 20px; gap: 8px; }
  .q-opt { padding: 14px 16px; font-size: 14px; }
  .q-top { padding: 50px 18px 10px; }

  .r-screen { padding: 30px 16px 50px; }
  .r-card { padding: 32px 20px 24px; }
  .r-portrait { width: 160px; max-height: 210px; }
  .r-code { font-size: 32px; letter-spacing: 2px; }
  .r-name { font-size: 16px; }
  .r-desc { font-size: 13px; line-height: 1.8; }
  .r-tag { font-size: 11px; padding: 5px 10px; }
  .r-btns { gap: 8px; }
  .r-btn { padding: 14px; font-size: 13px; }
}

/* Standard phones (376px - 428px) */
@media (min-width: 381px) and (max-width: 428px) {
  .r-portrait { width: 180px; max-height: 240px; }
  .r-code { font-size: 36px; }
}

/* Large phones & small tablets (429px - 768px) */
@media (min-width: 429px) and (max-width: 768px) {
  .r-portrait { width: 220px; max-height: 290px; }
  .intro-screen { padding: 0 32px; }
  .q-body { padding: 28px 32px 0; }
  .q-opts { padding: 0 32px 24px; }
}

/* Tablets and desktop (769px+) */
@media (min-width: 769px) {
  body { max-width: 480px; margin: 0 auto; box-shadow: 0 0 40px rgba(0,0,0,0.06); min-height: 100vh; }
  .r-portrait { width: 240px; max-height: 320px; }
  .intro-title { font-size: 42px; }
}

/* Safe area for notched phones (iPhone X+) */
@supports (padding-bottom: env(safe-area-inset-bottom)) {
  .r-screen { padding-bottom: calc(60px + env(safe-area-inset-bottom)); }
  .q-screen { padding-bottom: calc(40px + env(safe-area-inset-bottom)); }
  .q-top { padding-top: calc(56px + env(safe-area-inset-top)); }
  .intro-screen { padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }
}

/* Prevent text overflow on any screen */
.q-text, .r-desc, .r-tagline, .r-name { word-break: break-word; overflow-wrap: break-word; }

/* Touch-friendly tap targets (min 44px) */
.q-opt { min-height: 48px; }
.q-back, .intro-start, .r-btn { min-height: 44px; }

/* Landscape phone - make question area scrollable */
@media (max-height: 600px) and (orientation: landscape) {
  .intro-screen { padding-top: 20px; padding-bottom: 20px; }
  .intro-icon { font-size: 48px; margin-bottom: 12px; }
  .intro-title { font-size: 28px; }
  .intro-footer { margin-top: 16px; }
  .r-portrait { width: 140px; max-height: 180px; }
}
/* Enriched result sections */
.r-section{margin-top:28px;text-align:left;width:100%}
.r-section-title{font-size:13px;font-weight:600;color:var(--ink);margin-bottom:14px;display:flex;align-items:center;gap:6px}
.r-section-icon{font-size:15px}

/* Powers & Weakness */
.r-pw{display:flex;gap:12px;margin-bottom:0}
.r-pw-col{flex:1;padding:16px;border-radius:var(--radius-xs);font-size:13px;line-height:1.8}
.r-pw-col.power{background:rgba(46,204,113,0.06)}
.r-pw-col.weak{background:rgba(231,76,60,0.06)}
.r-pw-label{font-size:11px;font-weight:600;margin-bottom:8px;letter-spacing:0.5px}
.r-pw-col.power .r-pw-label{color:var(--green)}
.r-pw-col.weak .r-pw-label{color:var(--red)}
.r-pw-item{color:var(--ink2);margin-bottom:6px;padding-left:12px;position:relative}
.r-pw-item::before{content:"";position:absolute;left:0;top:8px;width:4px;height:4px;border-radius:50%}
.r-pw-col.power .r-pw-item::before{background:var(--green)}
.r-pw-col.weak .r-pw-item::before{background:var(--red)}

/* Radar chart */
.r-radar-wrap{display:flex;justify-content:center;margin:8px 0 0}
.r-radar-wrap canvas{max-width:260px;width:100%;height:auto}

/* Relationship cards */
.r-rel{display:flex;gap:10px;flex-wrap:wrap}
.r-rel-card{flex:1;min-width:calc(50% - 5px);background:var(--bg-warm);border-radius:var(--radius-xs);padding:14px;font-size:12px}
.r-rel-type{font-size:11px;font-weight:600;margin-bottom:6px;letter-spacing:0.5px}
.r-rel-type.best{color:var(--green)}
.r-rel-type.worst{color:var(--red)}
.r-rel-name{font-size:14px;font-weight:600;color:var(--ink);margin-bottom:4px}
.r-rel-why{color:var(--ink3);line-height:1.6}

/* Tips */
.r-tips-list{display:flex;flex-direction:column;gap:10px}
.r-tip{background:var(--bg-warm);border-radius:var(--radius-xs);padding:14px 16px;font-size:13px;color:var(--ink2);line-height:1.7;position:relative;padding-left:32px}
.r-tip-num{position:absolute;left:14px;top:14px;font-size:12px;font-weight:600;color:var(--ink3)}

/* Celeb */
.r-celeb{background:var(--bg-warm);border-radius:var(--radius-xs);padding:16px;font-size:13px;color:var(--ink2);line-height:1.7}

@media(max-width:380px){
  .r-pw{flex-direction:column;gap:8px}
  .r-rel-card{min-width:100%}
  .r-section{margin-top:22px}
}

</style>
</head>
<body>

<div class="screen intro-screen active" id="s-intro">
  <div class="intro-badge anim">PhD Type Indicator</div>
  <div class="intro-icon anim anim-d1">🧬</div>
  <div class="intro-title anim anim-d1">PHDTI</div>
  <div class="intro-subtitle anim anim-d2">科研把你搞成了什么人？</div>
  <div class="intro-desc anim anim-d2">
    12 道来自真实科研生活的灵魂拷问<br>
    4 个维度 · 16 种实验室人格
  </div>
  <div class="intro-dims anim anim-d3">
    <span class="intro-dim">卷 vs 躺</span>
    <span class="intro-dim">显 vs 隐</span>
    <span class="intro-dim">刚 vs 脆</span>
    <span class="intro-dim">信 vs 虚</span>
  </div>
  <div class="intro-disclaimer anim anim-d3">⚠️ 纯属科研人自嘲娱乐，请勿用于毕业答辩、基金申请或师生调解</div>
  <br>
  <button class="intro-start anim anim-d3" onclick="startTest()">开始测试</button>
  <div class="intro-footer anim anim-d3">LabBricker · 懂科研，更懂你</div>
</div>

<div class="screen q-screen" id="s-q">
  <div class="q-top">
    <button class="q-back" onclick="goIntro()">←</button>
    <div class="q-top-title">PHDTI 测试</div>
  </div>
  <div class="q-progress" id="q-progress"></div>
  <div class="q-body">
    <div class="q-counter" id="q-counter"></div>
    <div class="q-text" id="q-text"></div>
    <div class="q-hint" id="q-hint"></div>
  </div>
  <div class="q-opts" id="q-opts"></div>
</div>

<div class="screen r-screen" id="s-r">
  <div class="r-card" id="r-card"></div>
  <div class="r-btns" id="r-btns">
    <button class="r-btn r-btn-light" onclick="goIntro()">再测一次</button>
    <button class="r-btn r-btn-dark" onclick="shareResult()">分享结果</button>
  </div>
</div>

<!-- Share overlay -->
<div class="share-overlay" id="share-overlay" onclick="closeShare(event)">
  <div class="share-preview">
    <div class="share-preview-title">你的 PHDTI 结果卡片</div>
    <div class="share-preview-hint">长按图片保存，分享给你的同门</div>
    <img id="share-img" src="" alt="PHDTI result">
    <div class="share-preview-btns">
      <button class="share-close" onclick="closeShare()">关闭</button>
      <button class="share-save" onclick="downloadShare()">保存图片</button>
    </div>
  </div>
</div>

<!-- Hidden share card for screenshot -->
<div class="share-card" id="share-card"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

function drawRadar(canvasId,data){
  var canvas=document.getElementById(canvasId);if(!canvas)return;
  var ctx=canvas.getContext('2d');
  var W=canvas.width,H=canvas.height,cx=W/2,cy=H/2+6,R=Math.min(W,H)/2-30;
  ctx.clearRect(0,0,W,H);
  var n=data.length,step=Math.PI*2/n,startAngle=-Math.PI/2;
  // grid
  [0.2,0.4,0.6,0.8,1].forEach(function(s){
    ctx.beginPath();for(var i=0;i<n;i++){var a=startAngle+i*step;var x=cx+R*s*Math.cos(a);var y=cy+R*s*Math.sin(a);i===0?ctx.moveTo(x,y):ctx.lineTo(x,y)}
    ctx.closePath();ctx.strokeStyle='rgba(0,0,0,0.06)';ctx.lineWidth=0.5;ctx.stroke();
  });
  // axes
  for(var i=0;i<n;i++){var a=startAngle+i*step;ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+R*Math.cos(a),cy+R*Math.sin(a));ctx.strokeStyle='rgba(0,0,0,0.06)';ctx.lineWidth=0.5;ctx.stroke()}
  // data fill
  ctx.beginPath();
  for(var i=0;i<n;i++){var a=startAngle+i*step;var v=data[i]/100;var x=cx+R*v*Math.cos(a);var y=cy+R*v*Math.sin(a);i===0?ctx.moveTo(x,y):ctx.lineTo(x,y)}
  ctx.closePath();ctx.fillStyle='rgba(255,87,51,0.12)';ctx.fill();ctx.strokeStyle='#FF5733';ctx.lineWidth=1.5;ctx.stroke();
  // dots
  for(var i=0;i<n;i++){var a=startAngle+i*step;var v=data[i]/100;ctx.beginPath();ctx.arc(cx+R*v*Math.cos(a),cy+R*v*Math.sin(a),3,0,Math.PI*2);ctx.fillStyle='#FF5733';ctx.fill()}
  // labels
  ctx.fillStyle='#6B6B6B';ctx.font='11px Noto Sans SC, sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
  for(var i=0;i<n;i++){var a=startAngle+i*step;var lx=cx+(R+18)*Math.cos(a);var ly=cy+(R+18)*Math.sin(a);ctx.fillText(radarLabels[i]+' '+data[i],lx,ly)}
}

    // Celebrity
