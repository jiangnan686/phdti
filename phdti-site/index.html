<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PHDTI — PhD Type Indicator</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700;900&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #FAFAF8;
  --bg-warm: #F5F3EF;
  --bg-white: #FFFFFF;
  --ink: #1A1A1A;
  --ink2: #6B6B6B;
  --ink3: #A0A0A0;
  --ink4: #D4D4D4;
  --accent: #FF5733;
  --accent-soft: rgba(255,87,51,0.08);
  --accent-med: rgba(255,87,51,0.15);
  --green: #2ECC71;
  --blue: #3B82F6;
  --purple: #8B5CF6;
  --yellow: #F59E0B;
  --red: #E74C3C;
  --radius: 20px;
  --radius-sm: 14px;
  --radius-xs: 10px;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.04);
  --shadow-md: 0 4px 16px rgba(0,0,0,0.06);
  --shadow-lg: 0 8px 32px rgba(0,0,0,0.08);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Noto Sans SC',-apple-system,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}

.screen{display:none;min-height:100vh;flex-direction:column}
.screen.active{display:flex}

/* INTRO */
.intro-screen{padding:0 24px;justify-content:center;align-items:center;text-align:center;position:relative;overflow:hidden}
.intro-screen::before{content:'';position:absolute;top:-120px;right:-80px;width:300px;height:300px;background:radial-gradient(circle,rgba(255,87,51,0.06) 0%,transparent 70%);border-radius:50%}
.intro-screen::after{content:'';position:absolute;bottom:-100px;left:-60px;width:250px;height:250px;background:radial-gradient(circle,rgba(59,130,246,0.05) 0%,transparent 70%);border-radius:50%}

.intro-badge{display:inline-block;font-size:11px;font-weight:600;letter-spacing:1.5px;padding:6px 14px;border-radius:20px;background:var(--accent-soft);color:var(--accent);margin-bottom:24px;text-transform:uppercase;position:relative}
.intro-icon{font-size:72px;margin-bottom:20px;position:relative;animation:breathe 4s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}

.intro-title{font-family:'Playfair Display',serif;font-size:38px;font-weight:800;letter-spacing:-1px;line-height:1.15;margin-bottom:6px;position:relative}
.intro-subtitle{font-size:16px;color:var(--ink2);margin-bottom:28px;position:relative;font-weight:400}
.intro-desc{font-size:14px;color:var(--ink3);line-height:1.8;max-width:300px;margin:0 auto 20px;position:relative}

.intro-dims{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:32px;position:relative}
.intro-dim{font-size:12px;padding:6px 14px;border-radius:20px;background:var(--bg-warm);color:var(--ink2);font-weight:500;border:1px solid rgba(0,0,0,0.04)}

.intro-disclaimer{font-size:11px;color:var(--ink3);margin-bottom:32px;padding:10px 16px;background:var(--bg-warm);border-radius:var(--radius-xs);display:inline-block;position:relative}

.intro-start{display:block;width:100%;max-width:300px;padding:18px;border:none;border-radius:14px;background:var(--ink);color:var(--bg);font-size:16px;font-weight:600;cursor:pointer;font-family:'Noto Sans SC',sans-serif;transition:transform .15s,opacity .15s;letter-spacing:.3px;position:relative}
.intro-start:active{transform:scale(.97);opacity:.85}

.intro-footer{margin-top:40px;font-size:11px;color:var(--ink4);position:relative;letter-spacing:.5px}

/* QUESTION */
.q-screen{padding:0 0 40px;background:var(--bg)}
.q-top{padding:56px 24px 12px;display:flex;align-items:center;gap:14px;position:sticky;top:0;background:var(--bg);z-index:10}
.q-back{width:38px;height:38px;border-radius:12px;background:var(--bg-warm);border:1px solid rgba(0,0,0,.05);color:var(--ink);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.q-back:active{background:var(--ink4)}
.q-top-title{font-size:15px;font-weight:600;color:var(--ink2)}

.q-progress{display:flex;gap:4px;padding:0 24px;margin-bottom:8px}
.q-dot{flex:1;height:3px;border-radius:2px;background:var(--ink4);transition:background .35s}
.q-dot.done{background:var(--ink)}
.q-dot.now{background:var(--accent)}

.q-body{padding:28px 24px 0}
.q-counter{font-size:12px;color:var(--ink3);font-weight:500;letter-spacing:1px;margin-bottom:14px}
.q-text{font-size:22px;font-weight:700;line-height:1.45;margin-bottom:8px;letter-spacing:-.2px}
.q-hint{font-size:13px;color:var(--ink3);margin-bottom:28px;font-style:italic}

.q-opts{display:flex;flex-direction:column;gap:10px;padding:0 24px 24px}
.q-opt{background:var(--bg-white);border:1.5px solid rgba(0,0,0,.07);border-radius:var(--radius-sm);padding:18px 20px;font-size:15px;color:var(--ink);cursor:pointer;transition:all .15s;text-align:left;font-family:'Noto Sans SC',sans-serif;line-height:1.5;box-shadow:var(--shadow-sm)}
.q-opt:active{transform:scale(.98);border-color:var(--ink);background:var(--bg-warm)}

/* RESULT */
.r-screen{padding:40px 24px 60px;background:var(--bg);align-items:center}

.r-card{background:var(--bg-white);border-radius:var(--radius);padding:40px 28px 32px;box-shadow:var(--shadow-lg);border:1px solid rgba(0,0,0,.04);position:relative;overflow:hidden;width:100%;max-width:400px;text-align:center}
.r-bar{position:absolute;top:0;left:0;right:0;height:4px}
.r-portrait{width:200px;height:auto;max-height:260px;object-fit:contain;margin:0 auto 16px;display:block;border-radius:16px}
.r-emoji{font-size:56px;margin-bottom:14px;display:none}
.r-code{font-family:'Playfair Display',serif;font-size:40px;font-weight:800;letter-spacing:3px;margin-bottom:2px}
.r-name{font-size:18px;color:var(--ink2);font-weight:600;margin-bottom:6px}
.r-tagline{font-size:14px;color:var(--ink3);font-style:italic;margin-bottom:20px}
.r-divider{width:40px;height:2px;background:var(--ink4);margin:0 auto 20px}
.r-desc{font-size:14px;color:var(--ink2);line-height:1.9;margin-bottom:24px;text-align:left}

.r-dims{margin-bottom:24px}
.r-dim-row{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.r-dim-label{font-size:12px;color:var(--ink3);width:28px;text-align:center;font-weight:600}
.r-dim-track{flex:1;height:6px;background:var(--bg-warm);border-radius:3px;position:relative;overflow:hidden}
.r-dim-fill{position:absolute;top:0;height:100%;border-radius:3px;transition:width 1s ease}
.r-dim-fill.left{left:0}
.r-dim-fill.right{right:0}
.r-dim-pct{font-size:11px;color:var(--ink3);width:32px;text-align:center;font-weight:500}

.r-tags{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-bottom:24px}
.r-tag{font-size:12px;padding:6px 14px;border-radius:20px;background:var(--bg-warm);color:var(--ink2);font-weight:500}

.r-brand{font-size:11px;color:var(--ink4);letter-spacing:1px;margin-top:8px}

.r-btns{display:flex;gap:10px;margin-top:24px;width:100%;max-width:400px}
.r-btn{flex:1;padding:16px;border-radius:14px;border:none;font-size:14px;font-weight:600;cursor:pointer;font-family:'Noto Sans SC',sans-serif;transition:transform .15s}
.r-btn:active{transform:scale(.97)}
.r-btn-dark{background:var(--ink);color:var(--bg)}
.r-btn-light{background:var(--bg-warm);color:var(--ink);border:1px solid rgba(0,0,0,.06)}

@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.anim{animation:fadeUp .45s ease forwards}
.anim-d1{animation-delay:.06s;opacity:0}
.anim-d2{animation-delay:.12s;opacity:0}
.anim-d3{animation-delay:.18s;opacity:0}

/* ===== RESPONSIVE ===== */

/* Small phones (iPhone SE, 375px and below) */
@media (max-width: 380px) {
  .intro-title { font-size: 32px; }
  .intro-subtitle { font-size: 14px; }
  .intro-desc { font-size: 13px; }
  .intro-dims { gap: 6px; }
  .intro-dim { font-size: 11px; padding: 5px 10px; }
  .intro-screen { padding: 0 18px; }

  .q-body { padding: 20px 18px 0; }
  .q-text { font-size: 19px; }
  .q-opts { padding: 0 18px 20px; gap: 8px; }
  .q-opt { padding: 14px 16px; font-size: 14px; }
  .q-top { padding: 50px 18px 10px; }

  .r-screen { padding: 30px 16px 50px; }
  .r-card { padding: 32px 20px 24px; }
  .r-portrait { width: 160px; max-height: 210px; }
  .r-code { font-size: 32px; letter-spacing: 2px; }
  .r-name { font-size: 16px; }
  .r-desc { font-size: 13px; line-height: 1.8; }
  .r-tag { font-size: 11px; padding: 5px 10px; }
  .r-btns { gap: 8px; }
  .r-btn { padding: 14px; font-size: 13px; }
}

/* Standard phones (376px - 428px) */
@media (min-width: 381px) and (max-width: 428px) {
  .r-portrait { width: 180px; max-height: 240px; }
  .r-code { font-size: 36px; }
}

/* Large phones & small tablets (429px - 768px) */
@media (min-width: 429px) and (max-width: 768px) {
  .r-portrait { width: 220px; max-height: 290px; }
  .intro-screen { padding: 0 32px; }
  .q-body { padding: 28px 32px 0; }
  .q-opts { padding: 0 32px 24px; }
}

/* Tablets and desktop (769px+) */
@media (min-width: 769px) {
  body { max-width: 480px; margin: 0 auto; box-shadow: 0 0 40px rgba(0,0,0,0.06); min-height: 100vh; }
  .r-portrait { width: 240px; max-height: 320px; }
  .intro-title { font-size: 42px; }
}

/* Safe area for notched phones (iPhone X+) */
@supports (padding-bottom: env(safe-area-inset-bottom)) {
  .r-screen { padding-bottom: calc(60px + env(safe-area-inset-bottom)); }
  .q-screen { padding-bottom: calc(40px + env(safe-area-inset-bottom)); }
  .q-top { padding-top: calc(56px + env(safe-area-inset-top)); }
  .intro-screen { padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }
}

/* Prevent text overflow on any screen */
.q-text, .r-desc, .r-tagline, .r-name { word-break: break-word; overflow-wrap: break-word; }

/* Touch-friendly tap targets (min 44px) */
.q-opt { min-height: 48px; }
.q-back, .intro-start, .r-btn { min-height: 44px; }

/* Landscape phone - make question area scrollable */
@media (max-height: 600px) and (orientation: landscape) {
  .intro-screen { padding-top: 20px; padding-bottom: 20px; }
  .intro-icon { font-size: 48px; margin-bottom: 12px; }
  .intro-title { font-size: 28px; }
  .intro-footer { margin-top: 16px; }
  .r-portrait { width: 140px; max-height: 180px; }
}

</style>
</head>
<body>

<div class="screen intro-screen active" id="s-intro">
  <div class="intro-badge anim">PhD Type Indicator</div>
  <div class="intro-icon anim anim-d1">🧬</div>
  <div class="intro-title anim anim-d1">PHDTI</div>
  <div class="intro-subtitle anim anim-d2">科研把你搞成了什么人？</div>
  <div class="intro-desc anim anim-d2">
    12 道来自真实科研生活的灵魂拷问<br>
    4 个维度 · 16 种实验室人格
  </div>
  <div class="intro-dims anim anim-d3">
    <span class="intro-dim">卷 vs 躺</span>
    <span class="intro-dim">显 vs 隐</span>
    <span class="intro-dim">刚 vs 脆</span>
    <span class="intro-dim">信 vs 虚</span>
  </div>
  <div class="intro-disclaimer anim anim-d3">⚠️ 纯属科研人自嘲娱乐，请勿用于毕业答辩、基金申请或师生调解</div>
  <br>
  <button class="intro-start anim anim-d3" onclick="startTest()">开始测试</button>
  <div class="intro-footer anim anim-d3">LabBricker · 懂科研，更懂你</div>
</div>

<div class="screen q-screen" id="s-q">
  <div class="q-top">
    <button class="q-back" onclick="goIntro()">←</button>
    <div class="q-top-title">PHDTI 测试</div>
  </div>
  <div class="q-progress" id="q-progress"></div>
  <div class="q-body">
    <div class="q-counter" id="q-counter"></div>
    <div class="q-text" id="q-text"></div>
    <div class="q-hint" id="q-hint"></div>
  </div>
  <div class="q-opts" id="q-opts"></div>
</div>

<div class="screen r-screen" id="s-r">
  <div class="r-card" id="r-card"></div>
  <div class="r-btns" id="r-btns">
    <button class="r-btn r-btn-light" onclick="goIntro()">再测一次</button>
    <button class="r-btn r-btn-dark" onclick="shareResult()">分享结果</button>
  </div>
</div>

<script>
// ===== DIMENSION SYSTEM =====
// D1: G(Grind卷) vs C(Chill躺)
// D2: L(Loud显) vs Q(Quiet隐)
// D3: T(Tough刚) vs S(Soft脆)
// D4: F(Faith信) vs N(Nihil虚)

const questions = [
  // === Q1-3: Primary D1 (G/C), Secondary D4 (F/N) ===
  {
    q: "周一早上闹钟响了，你的第一个念头是？",
    hint: "诚实回答，没人看得到",
    opts: [
      { t: "今天有个实验方案想验证，赶紧去", d: { G:3, C:0, F:2, N:0 } },
      { t: "叹口气，但还是准时到了实验室", d: { G:2, C:1, F:0, N:1 } },
      { t: "再躺五分钟…… 五十分钟后出门", d: { G:0, C:2, F:1, N:1 } },
      { t: "认真考虑今天能不能不去", d: { G:0, C:3, F:0, N:2 } }
    ]
  },
  {
    q: "导师突然加了一个新课题给你：",
    hint: "别装，说真话",
    opts: [
      { t: "兴奋！新方向意味着新机会", d: { G:3, C:0, F:3, N:0 } },
      { t: "接了，反正多做一个也无所谓", d: { G:2, C:1, F:0, N:1 } },
      { t: "表面答应，心里算着怎么偷工减料", d: { G:0, C:2, F:0, N:2 } },
      { t: "想拒绝但不敢，默默加到待办清单最后", d: { G:0, C:2, F:1, N:1 } }
    ]
  },
  {
    q: "晚上十点，实验还没做完：",
    hint: "你的真实选择",
    opts: [
      { t: "做完再走，差这一步了", d: { G:3, C:0, F:2, N:0 } },
      { t: "硬撑，但心里在骂自己效率低", d: { G:2, C:0, F:0, N:2 } },
      { t: "明天再说吧，不差这一晚", d: { G:0, C:3, F:0, N:1 } },
      { t: "纠结半小时到底走不走，最后还是走了", d: { G:0, C:2, F:1, N:1 } }
    ]
  },

  // === Q4-6: Primary D2 (L/Q), Secondary D3 (T/S) ===
  {
    q: "组会上你的实验数据被质疑了：",
    hint: "你的本能反应",
    opts: [
      { t: "当场反驳，拿数据说话", d: { L:3, Q:0, T:3, S:0 } },
      { t: "嘴上解释，但下来跟同门吐槽半小时", d: { L:2, Q:0, T:1, S:2 } },
      { t: "沉默，回去默默把实验重做一遍", d: { L:0, Q:3, T:2, S:1 } },
      { t: "低头不说话，散会后躲厕所缓缓", d: { L:0, Q:2, T:0, S:3 } }
    ]
  },
  {
    q: "实验室来了新人，你会？",
    hint: "社交本能测试",
    opts: [
      { t: "主动介绍自己，带人逛一圈实验室", d: { L:3, Q:0, T:1, S:0 } },
      { t: "等别人介绍，但聊起来还挺热的", d: { L:2, Q:1, T:0, S:1 } },
      { t: "点个头算打过招呼了", d: { L:0, Q:3, T:2, S:0 } },
      { t: "假装没看见，等对方先来找自己", d: { L:0, Q:2, T:0, S:2 } }
    ]
  },
  {
    q: "你在实验室的存在感是：",
    hint: "别人眼中的你",
    opts: [
      { t: "气氛担当，没我实验室安静得像灵堂", d: { L:3, Q:0, T:2, S:0 } },
      { t: "吐槽担当，负责帮大家骂导师", d: { L:2, Q:0, T:0, S:2 } },
      { t: "技术担当，平时不说话但仪器坏了都找我", d: { L:0, Q:3, T:3, S:0 } },
      { t: "隐形人，有人以为我已经毕业了", d: { L:0, Q:2, T:0, S:2 } }
    ]
  },

  // === Q7-9: Primary D3 (T/S), Secondary D1 (G/C) ===
  {
    q: "实验连续失败三次，你现在的状态：",
    hint: "你的心理弹性",
    opts: [
      { t: "冷静排查，列出所有可能的变量逐一排除", d: { T:3, S:0, G:2, C:0 } },
      { t: "烦躁，但咬着牙做第四次", d: { T:2, S:1, G:2, C:0 } },
      { t: "开始怀疑人生，但先吃顿好的缓缓", d: { T:0, S:2, G:0, C:2 } },
      { t: "已经在厕所哭过了 / 想哭但哭不出来", d: { T:0, S:3, G:0, C:1 } }
    ]
  },
  {
    q: "审稿人给了一堆 harsh comments：",
    hint: "你看到邮件那一刻",
    opts: [
      { t: "逐条分析，该改的改，该怼的怼", d: { T:3, S:0, G:3, C:0 } },
      { t: "先骂十分钟审稿人，骂完开始改", d: { T:2, S:1, G:1, C:0 } },
      { t: "关掉邮件假装没看到，过两天再说", d: { T:0, S:2, G:0, C:3 } },
      { t: "整个人emo了，觉得自己写的就是垃圾", d: { T:0, S:3, G:0, C:1 } }
    ]
  },
  {
    q: "课题方向被证明可能走不通了：",
    hint: "这是真正的考验",
    opts: [
      { t: "果断转向，沉没成本不值得留恋", d: { T:3, S:0, G:2, C:0 } },
      { t: "焦虑，但理性分析后还是选择调整", d: { T:2, S:1, G:1, C:0 } },
      { t: "崩溃，这意味着前面全白做了", d: { T:0, S:3, G:0, C:1 } },
      { t: "无所谓了，反正也不指望这个毕业", d: { T:1, S:1, G:0, C:3 } }
    ]
  },

  // === Q10-12: Primary D4 (F/N), Secondary D2 (L/Q) ===
  {
    q: "如果可以重来，你还会选科研吗？",
    hint: "凌晨三点问自己的那个问题",
    opts: [
      { t: "会，科研是我真正想做的事", d: { F:3, N:0, L:1, Q:1 } },
      { t: "大概会，虽然痛苦但还是有成就感", d: { F:2, N:1, L:0, Q:1 } },
      { t: "不好说，可能会试试别的路", d: { F:1, N:2, L:1, Q:1 } },
      { t: "绝对不会，这条路太亏了", d: { F:0, N:3, L:1, Q:0 } }
    ]
  },
  {
    q: "看到同门发了一篇好文章：",
    hint: "你的真实内心活动",
    opts: [
      { t: "由衷高兴，也被激励到了", d: { F:3, N:0, L:2, Q:0 } },
      { t: "祝贺，然后偷偷回去加班", d: { F:2, N:0, L:0, Q:3 } },
      { t: "表面祝贺，内心五味杂陈", d: { F:0, N:2, L:1, Q:2 } },
      { t: "无感，发不发跟我没关系", d: { F:0, N:3, L:0, Q:2 } }
    ]
  },
  {
    q: "你觉得你的科研生涯最后会怎样？",
    hint: "最后一题，对自己诚实",
    opts: [
      { t: "会做出有价值的成果，我相信", d: { F:3, N:0, L:2, Q:0 } },

// ===== STATE =====
let cur = 0;
let scores = { G:0, C:0, L:0, Q:0, T:0, S:0, F:0, N:0 };

function goIntro() {
  cur = 0;
  scores = { G:0, C:0, L:0, Q:0, T:0, S:0, F:0, N:0 };
  showScreen('intro');
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('s-' + id).classList.add('active');
  window.scrollTo(0, 0);
}

function startTest() {
  cur = 0;
  scores = { G:0, C:0, L:0, Q:0, T:0, S:0, F:0, N:0 };
  showScreen('q');
  buildProgress();
  showQ();
}

function buildProgress() {
  document.getElementById('q-progress').innerHTML =
    questions.map((_, i) => `<div class="q-dot" data-i="${i}"></div>`).join('');
}

function updateProgress() {
  document.querySelectorAll('.q-dot').forEach((d, i) => {
    d.className = 'q-dot';
    if (i < cur) d.classList.add('done');
    if (i === cur) d.classList.add('now');
  });
}

function showQ() {
  updateProgress();
  const q = questions[cur];
  document.getElementById('q-counter').textContent = `${cur + 1} / ${questions.length}`;
  document.getElementById('q-text').textContent = q.q;
  document.getElementById('q-hint').textContent = q.hint || '';

  const el = document.getElementById('q-opts');
  el.innerHTML = '';
  q.opts.forEach((o, i) => {
    const b = document.createElement('button');
    b.className = 'q-opt';
    b.textContent = o.t;
    b.style.animation = 'fadeUp 0.3s ease forwards';
    b.style.animationDelay = `${i * 0.05}s`;
    b.style.opacity = '0';
    b.onclick = () => pick(o.d);
    el.appendChild(b);
  });
}

function pick(d) {
  Object.keys(d).forEach(k => { if (scores[k] !== undefined) scores[k] += d[k]; });
  cur++;
  if (cur < questions.length) {
    showQ();
  } else {
    calcResult();
  }
}

function calcResult() {
  // Calculate each dimension
  const dims = [
    { a: 'G', b: 'C', labelA: '卷', labelB: '躺' },
    { a: 'L', b: 'Q', labelA: '显', labelB: '隐' },
    { a: 'T', b: 'S', labelA: '刚', labelB: '脆' },
    { a: 'F', b: 'N', labelA: '信', labelB: '虚' }
  ];

  let code = '';
  const dimResults = [];

  dims.forEach(dim => {
    const total = scores[dim.a] + scores[dim.b];
    const pctA = total > 0 ? Math.round((scores[dim.a] / total) * 100) : 50;
    const winner = scores[dim.a] >= scores[dim.b] ? dim.a : dim.b;
    code += winner;
    dimResults.push({
      letterA: dim.a,
      letterB: dim.b,
      labelA: dim.labelA,
      labelB: dim.labelB,
      pctA: pctA,
      pctB: 100 - pctA,
      winner
    });
  });

  const result = types[code];
  if (!result) { console.error('No type found for', code); return; }

  showScreen('r');
  renderResult(code, result, dimResults);
}

function renderResult(code, r, dims) {
  const card = document.getElementById('r-card');
  card.style.animation = 'fadeUp 0.5s ease';
  const imgFile = code === 'CLTN' ? 'CLTN_' : code;
  card.innerHTML = `
    <div class="r-bar" style="background:${r.accent}"></div>
    <img class="r-portrait" src="img/${imgFile}.png" alt="${r.name}" onerror="this.style.display='none'">
    <div class="r-emoji">${r.emoji}</div>
    <div class="r-code" style="color:${r.accent}">${code}</div>
    <div class="r-name">${r.name}</div>
    <div class="r-tagline">${r.tagline}</div>
    <div class="r-divider"></div>
    <div class="r-desc">${r.desc}</div>
    <div class="r-dims">
      ${dims.map(d => {
        const colors = {
          G: '#FF5733', C: '#3B82F6',
          L: '#F59E0B', Q: '#8B5CF6',
          T: '#1A1A1A', S: '#E74C3C',
          F: '#2ECC71', N: '#A0A0A0'
        };
        return `<div class="r-dim-row">
          <div class="r-dim-label" style="color:${colors[d.letterA]}">${d.labelA}</div>
          <div class="r-dim-track">
            <div class="r-dim-fill left" style="width:${d.pctA}%;background:${colors[d.letterA]}"></div>
          </div>
          <div class="r-dim-track">
            <div class="r-dim-fill right" style="width:${d.pctB}%;background:${colors[d.letterB]}"></div>
          </div>
          <div class="r-dim-label" style="color:${colors[d.letterB]}">${d.labelB}</div>
        </div>`;
      }).join('')}
    </div>
    <div class="r-tags">
      ${r.tags.map(t => `<span class="r-tag">${t}</span>`).join('')}
    </div>
    <div class="r-brand">PHDTI · LabBricker · 懂科研，更懂你</div>
  `;

  document.getElementById('r-btns').style.animation = 'fadeUp 0.5s ease 0.15s';
  document.getElementById('r-btns').style.opacity = '0';
  document.getElementById('r-btns').style.animationFillMode = 'forwards';
}

function shareResult() {
  alert('分享功能即将上线！');
}
